<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>KT11 Registration</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem; background: #eef3f8; color: #1a2433; max-width: 480px; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    #form-status { margin-top: 1rem; padding: 0.5rem; background: #fff; border: 1px solid #9bb0c5; }
    #form-status.error { border-color: #c0392b; color: #922b21; }
    #form-status.ok { border-color: #1e8449; color: #145a32; }
  </style>
</head>
<body>
  <h1 id="register-heading">Регистрация KT11</h1>
  <p><a id="back-home" href="index.html">На главную</a></p>
  <form id="register-form" novalidate>
    <label for="reg-name">Имя</label>
    <input id="reg-name" name="name" type="text">
    <label for="reg-email">Email</label>
    <input id="reg-email" name="email" type="email">
    <button id="reg-submit" type="submit">Отправить</button>
  </form>
  <div id="form-status">Статус: ожидание</div>
  <script>
    document.getElementById("register-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("reg-name").value.trim();
      var email = document.getElementById("reg-email").value.trim();
      var status = document.getElementById("form-status");
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!name || !emailOk) {
        status.className = "error";
        status.textContent = "Статус: ошибка валидации";
        return;
      }
      status.className = "ok";
      status.textContent = "Статус: принято — " + name + " <" + email + ">";
    });
  </script>
</body>
</html>
