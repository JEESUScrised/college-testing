<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Campus Portal Demo — Кабинет</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 2rem auto; background: #f4f6f8; }
    .card { background: #fff; padding: 1.5rem; border: 1px solid #d0d7de; border-radius: 8px; }
    label { display: block; margin-top: 0.8rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.6rem 1rem; }
    .error { color: #b42318; margin-top: 0.8rem; display: none; }
    .success { color: #1a7f37; margin-top: 0.8rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="dash-heading">Личный кабинет</h1>
    <p id="welcome">Здравствуйте, <span id="user-label">гость</span>!</p>
    <h2>Заказ учебника</h2>
    <form id="order-form">
      <label for="book">Книга</label>
      <select id="book">
        <option value="testing">Основы тестирования</option>
        <option value="selenium">Selenium на практике</option>
      </select>
      <label for="quantity">Количество</label>
      <input id="quantity" type="number" value="1">
      <button id="order-submit" type="submit">Оформить заказ</button>
    </form>
    <p id="order-error" class="error" role="alert">Количество должно быть больше 0</p>
    <p id="order-success" class="success" role="status">Заказ оформлен успешно</p>
    <p><a id="logout" href="index.html">Выйти</a></p>
  </div>
  <script>
    var user = sessionStorage.getItem("campusUser") || "гость";
    document.getElementById("user-label").textContent = user;

    // Expected: quantity must be an integer > 0.
    // SEED-003: quantity 0 is accepted and shows success.
    document.getElementById("order-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var qty = Number(document.getElementById("quantity").value);
      var error = document.getElementById("order-error");
      var success = document.getElementById("order-success");
      error.style.display = "none";
      success.style.display = "none";

      if (isNaN(qty) || qty < 0) {
        error.style.display = "block";
        return;
      }
      // SEED-003: missing qty === 0 rejection
      success.textContent = "Заказ оформлен успешно (шт.: " + qty + ")";
      success.style.display = "block";
    });
  </script>
</body>
</html>
