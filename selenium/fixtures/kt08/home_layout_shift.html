<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>KT08 Visual Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f3f6f9;
      color: #1d2a36;
    }
    header {
      background: #0f6e56;
      color: #fff;
      padding: 24px 40px;
    }
    h1 { margin: 0 0 8px; font-size: 32px; }
    #subtitle { margin: 0; opacity: 0.95; }
    main {
      /* Intentional layout shift: more left padding / offset */
      padding: 32px 40px 32px 160px;
      max-width: 900px;
    }
    .card {
      background: #ffffff;
      border: 2px solid #c9d6e2;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      margin-top: 48px;
    }
    #accent-box {
      width: 220px;
      height: 80px;
      background: #e8a317;
      border-radius: 6px;
      margin: 16px 0;
    }
    #action-btn {
      background: #1f4b99;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    #logo {
      width: 64px;
      height: 64px;
      display: block;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">Визуальная страница KT08</h1>
    <p id="subtitle">Базовый эталонный макет</p>
  </header>
  <main>
    <section class="card" id="info-card">
      <p id="description">Контролируемый layout для screenshot regression.</p>
      <div id="accent-box"></div>
      <button id="action-btn" type="button">Основная кнопка</button>
      <svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="logo">
        <rect width="64" height="64" rx="8" fill="#0f6e56"/>
        <circle cx="32" cy="32" r="14" fill="#e8a317"/>
      </svg>
    </section>
  </main>
</body>
</html>
