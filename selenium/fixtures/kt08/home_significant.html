<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>KT08 Visual Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: #1a1025;
      color: #f7e9ff;
    }
    header {
      background: #7b1fa2;
      color: #fff;
      padding: 40px;
    }
    h1 { margin: 0 0 8px; font-size: 40px; }
    #subtitle { margin: 0; }
    main { padding: 48px; }
    .card {
      background: #311b4a;
      border: 4px solid #ffeb3b;
      border-radius: 0;
      padding: 32px;
    }
    #accent-box {
      width: 100%;
      height: 140px;
      background: #ff5722;
      margin: 24px 0;
    }
    #action-btn {
      background: #ffeb3b;
      color: #000;
      border: 3px solid #fff;
      border-radius: 0;
      padding: 16px 28px;
      font-size: 18px;
    }
    #logo { display: none; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">Полностью другой экран</h1>
    <p id="subtitle">Значительное визуальное отличие</p>
  </header>
  <main>
    <section class="card" id="info-card">
      <p id="description">Этот макет намеренно сильно отличается от baseline.</p>
      <div id="accent-box"></div>
      <button id="action-btn" type="button">Другая кнопка</button>
    </section>
  </main>
</body>
</html>
