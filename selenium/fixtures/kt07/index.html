<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>KT07 Grid Landing</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem; background: #eef3f8; color: #1a2433; }
    #status { margin-top: 1rem; padding: 0.75rem; background: #fff; border: 1px solid #9bb0c5; }
    button { font-size: 1rem; padding: 0.4rem 0.9rem; }
  </style>
</head>
<body>
  <h1 id="heading">Selenium Grid KT07</h1>
  <p id="intro">Локальная страница для удалённых WebDriver-сессий.</p>
  <label for="name-input">Имя:</label>
  <input id="name-input" type="text" placeholder="Введите имя">
  <button id="submit-btn" type="button">Отправить</button>
  <div id="status">Статус: ожидание ввода</div>
  <script>
    document.getElementById("submit-btn").addEventListener("click", function () {
      var value = document.getElementById("name-input").value.trim();
      document.getElementById("status").textContent = value
        ? ("Статус: принято — " + value)
        : "Статус: пустое значение";
    });
  </script>
</body>
</html>
